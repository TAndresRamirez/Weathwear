name: weathwear
description: "Monitoreo climático con recomendación de vestimenta y clasificación de prendas por visión computacional."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2
  flutter: 3.47.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0 # Cliente de la API Open-Meteo
  sqflite: ^2.4.4 # Base de datos local
  path: ^1.9.1
  path_provider: ^2.1.6 # Rutas de BD y fotos de prendas
  workmanager: ^0.10.10 # ETL periódico en segundo plano
  tflite_flutter: ^0.12.1 # Clasificador de prendas
  image: ^4.10.1 # Preprocesamiento de imágenes para el modelo
  image_picker: ^1.2.3 # Cámara y galería
  geolocator: ^14.1.2 # Ubicación del usuario
  share_plus: ^13.3.1 # Exportar respaldo de la BD

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3 # SQLite en memoria para tests
  flutter_launcher_icons: ^0.14.4 # Genera los íconos de la app

flutter:
  uses-material-design: true
  assets:
    - assets/models/clothing_model.tflite
    - assets/models/labels.txt
    - assets/icons/weather/

# Íconos de la app: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png" # Android < 8
  adaptive_icon_foreground: "assets/icon/icon_foreground.png" # Android 8+
  adaptive_icon_background: "assets/icon/icon_background.png"
  min_sdk_android: 21
